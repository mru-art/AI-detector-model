# Postgres + MinIO (S3-compatible storage) for the backend.
# Run from the repo root:  docker compose -f local_dev/docker-compose.yml up -d
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: forensics
      POSTGRES_PASSWORD: forensics
      POSTGRES_DB: forensics
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # web console
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  miniodata:
